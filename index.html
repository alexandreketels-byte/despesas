<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despesas do Casal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE9DD;
    --paper-raised:#F7F3E9;
    --ink:#20293A;
    --ink-soft:#5B6472;
    --line:#D8D0BE;
    --brass:#A9772F;
    --brass-soft:#EDE0C8;
    --sage:#5C7A63;
    --rose:#B5544A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    padding:28px 18px 60px;
  }
  h1,h2,.num{
    font-family:'Fraunces',serif;
  }
  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:22px;
    text-align:center;
  }
  #loginScreen h1{
    font-size:28px;
    font-weight:500;
    margin:0;
  }
  #loginScreen p{
    color:var(--ink-soft);
    margin:0;
    font-size:14px;
  }
  #pinInput{
    font-family:'Fraunces',serif;
    font-size:26px;
    letter-spacing:6px;
    text-align:center;
    width:180px;
    padding:12px 10px;
    border:none;
    border-bottom:2px solid var(--ink);
    background:transparent;
    color:var(--ink);
  }
  #pinInput:focus{outline:none;border-color:var(--brass);}
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:3px;
    padding:12px 22px;
    cursor:pointer;
    background:var(--ink);
    color:var(--paper-raised);
  }
  .btn:active{transform:translateY(1px);}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  #loginError{color:var(--rose);font-size:13px;min-height:16px;}

  /* ---------- MAIN ---------- */
  #mainScreen{display:none;}
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:22px;
  }
  .top-row h1{
    font-size:22px;
    font-weight:500;
    margin:0;
  }
  #logoutBtn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
  }

  .ledger-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 20px;
    margin-bottom:26px;
  }
  .ledger-total{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:16px;
  }
  .ledger-total .label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .ledger-total .num{
    font-size:36px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .split-row{
    display:flex;
    justify-content:space-between;
  }
  .split-item{text-align:left;}
  .split-item .label{font-size:12px;color:var(--ink-soft);}
  .split-item .num{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--brass);}

  section{margin-bottom:30px;}
  section h2{
    font-size:15px;
    font-weight:500;
    margin:0 0 12px;
    color:var(--ink);
  }

  .gasto-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .gasto-row .nome{
    flex:1;
    font-size:15px;
  }
  .gasto-row input.valor{
    width:100px;
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    text-align:right;
    padding:8px 8px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
  }
  .gasto-row input.valor:focus{outline:none;border-color:var(--brass);}
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:16px;
    padding:4px;
    line-height:1;
  }
  .icon-btn.save{color:var(--sage);}
  .icon-btn.del{color:var(--rose);}
  .icon-btn:disabled{opacity:.35;cursor:default;}

  #addForm{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  #addForm input[type=text]{
    flex:1;
    padding:10px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  #addForm input[type=number]{
    width:90px;
    padding:10px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:14px;
    color:var(--ink);
  }

  .hist-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .hist-row .mes{
    width:64px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .hist-bar-wrap{
    flex:1;
    background:var(--line);
    border-radius:2px;
    height:8px;
    overflow:hidden;
  }
  .hist-bar{
    height:100%;
    background:var(--brass);
    border-radius:2px;
  }
  .hist-row .valor{
    width:88px;
    text-align:right;
    font-size:13px;
    font-variant-numeric:tabular-nums;
  }
  .hist-row .delta{
    width:44px;
    text-align:right;
    font-size:12px;
  }
  .delta.up{color:var(--rose);}
  .delta.down{color:var(--sage);}

  .empty-note{
    color:var(--ink-soft);
    font-size:13px;
    padding:10px 0;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper-raised);
    padding:10px 18px;
    border-radius:4px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app">

  <!-- LOGIN -->
  <div id="loginScreen">
    <h1>Despesas do casal</h1>
    <p>Digite o PIN para entrar</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="8" autofocus>
    <button class="btn" onclick="doLogin()">Entrar</button>
    <div id="loginError"></div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen">
    <div class="top-row">
      <h1>Despesas do casal</h1>
      <button id="logoutBtn" onclick="doLogout()">sair</button>
    </div>

    <div class="ledger-card">
      <div class="ledger-total">
        <div>
          <div class="label">Total do mês</div>
          <div class="num" id="totalNum">R$ 0,00</div>
        </div>
      </div>
      <div class="split-row">
        <div class="split-item">
          <div class="label">Cada um (50%)</div>
          <div class="num" id="splitNum">R$ 0,00</div>
        </div>
      </div>
    </div>

    <section>
      <h2>Gastos fixos</h2>
      <div id="gastosList"></div>
      <form id="addForm" onsubmit="return addGasto(event)">
        <input type="text" id="novoNome" placeholder="Nome do gasto" required>
        <input type="number" id="novoValor" placeholder="0,00" step="0.01" min="0" required>
        <button type="submit" class="btn secondary">+</button>
      </form>
    </section>

    <section>
      <h2>Histórico mensal</h2>
      <div id="historicoList"></div>
    </section>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = 'COLE_AQUI_A_URL_DO_APPS_SCRIPT';

  let gastos = [];

  function fmt(v){
    return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 1800);
  }

  async function api(action, payload){
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({action, payload: payload||{}})
    });
    return res.json();
  }

  // ---------- AUTH ----------
  function doLogin(){
    const pin = document.getElementById('pinInput').value.trim();
    if(!pin) return;
    document.getElementById('loginError').textContent = '';
    api('login', {pin}).then(r=>{
      if(r.ok){
        localStorage.setItem('despesas_pin', pin);
        showMain();
      } else {
        document.getElementById('loginError').textContent = r.error || 'PIN incorreto';
      }
    }).catch(()=>{
      document.getElementById('loginError').textContent = 'Erro de conexão';
    });
  }

  function doLogout(){
    localStorage.removeItem('despesas_pin');
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('pinInput').value = '';
  }

  function showMain(){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    loadGastos();
    loadHistorico();
  }

  // ---------- GASTOS ----------
  function loadGastos(){
    api('getGastos').then(r=>{
      if(r.ok){
        gastos = r.gastos;
        renderGastos();
      }
    });
  }

  function renderGastos(){
    const list = document.getElementById('gastosList');
    list.innerHTML = '';
    if(gastos.length === 0){
      list.innerHTML = '<div class="empty-note">Nenhum gasto cadastrado ainda.</div>';
    }
    let total = 0;
    gastos.forEach(g=>{
      total += Number(g.valor)||0;
      const row = document.createElement('div');
      row.className = 'gasto-row';
      row.innerHTML = `
        <div class="nome">${g.nome}</div>
        <input class="valor" type="number" step="0.01" value="${g.valor}" data-id="${g.id}">
        <button class="icon-btn save" title="Salvar" data-id="${g.id}">✓</button>
        <button class="icon-btn del" title="Remover" data-id="${g.id}">✕</button>
      `;
      list.appendChild(row);
    });
    document.getElementById('totalNum').textContent = fmt(total);
    document.getElementById('splitNum').textContent = fmt(total/2);

    list.querySelectorAll('.icon-btn.save').forEach(btn=>{
      btn.addEventListener('click', ()=> saveGastoRow(btn.dataset.id));
    });
    list.querySelectorAll('.icon-btn.del').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteGastoRow(btn.dataset.id));
    });
  }

  function saveGastoRow(id){
    const input = document.querySelector(`input.valor[data-id="${id}"]`);
    const gasto = gastos.find(g=>g.id===id);
    const novoValor = parseFloat(input.value) || 0;
    api('saveGasto', {id, nome: gasto ? gasto.nome : '', valor: novoValor}).then(r=>{
      if(r.ok){
        showToast('Salvo');
        loadGastos();
        loadHistorico();
      } else {
        showToast(r.error || 'Erro ao salvar');
      }
    });
  }

  function deleteGastoRow(id){
    if(!confirm('Remover este gasto da lista?')) return;
    api('deleteGasto', {id}).then(r=>{
      if(r.ok){
        showToast('Removido');
        loadGastos();
      } else {
        showToast(r.error || 'Erro ao remover');
      }
    });
  }

  function addGasto(ev){
    ev.preventDefault();
    const nome = document.getElementById('novoNome').value.trim();
    const valor = parseFloat(document.getElementById('novoValor').value) || 0;
    if(!nome) return false;
    api('addGasto', {nome, valor}).then(r=>{
      if(r.ok){
        document.getElementById('novoNome').value = '';
        document.getElementById('novoValor').value = '';
        showToast('Gasto adicionado');
        loadGastos();
        loadHistorico();
      } else {
        showToast(r.error || 'Erro ao adicionar');
      }
    });
    return false;
  }

  // ---------- HISTORICO ----------
  function loadHistorico(){
    api('getHistorico').then(r=>{
      if(r.ok) renderHistorico(r.historico);
    });
  }

  function renderHistorico(historico){
    const list = document.getElementById('historicoList');
    list.innerHTML = '';
    if(!historico || historico.length === 0){
      list.innerHTML = '<div class="empty-note">Ainda sem histórico. Ele vai aparecer conforme os meses passam.</div>';
      return;
    }
    const maxTotal = Math.max(...historico.map(h=>h.total), 1);
    historico.slice().reverse().forEach((h, idx)=>{
      const prev = historico[historico.length - 1 - idx - 1];
      let deltaHtml = '';
      if(prev){
        const diff = h.total - prev.total;
        if(Math.abs(diff) > 0.005){
          const cls = diff > 0 ? 'up' : 'down';
          const arrow = diff > 0 ? '▲' : '▼';
          deltaHtml = `<div class="delta ${cls}">${arrow} ${fmt(Math.abs(diff))}</div>`;
        } else {
          deltaHtml = `<div class="delta"></div>`;
        }
      } else {
        deltaHtml = `<div class="delta"></div>`;
      }
      const row = document.createElement('div');
      row.className = 'hist-row';
      row.innerHTML = `
        <div class="mes">${mesLabel(h.mes)}</div>
        <div class="hist-bar-wrap"><div class="hist-bar" style="width:${(h.total/maxTotal*100).toFixed(0)}%"></div></div>
        <div class="valor">${fmt(h.total)}</div>
        ${deltaHtml}
      `;
      list.appendChild(row);
    });
  }

  function mesLabel(mesKey){
    const [ano, mes] = mesKey.split('-');
    const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return nomes[parseInt(mes,10)-1] + '/' + ano.slice(2);
  }

  // ---------- INIT ----------
  (function init(){
    const savedPin = localStorage.getItem('despesas_pin');
    if(savedPin){
      api('login', {pin: savedPin}).then(r=>{
        if(r.ok) showMain();
      });
    }
  })();
</script>

</body>
</html>
